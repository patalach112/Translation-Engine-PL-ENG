name: Test StreamPL engine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit and HTTP API tests
        run: npm test
      - name: Check server and browser syntax
        run: |
          node --check server/index.js
          node --check server/translation-service.js
          node --check server/providers/ollama.js
          node --check server/providers/openai-compatible.js
          node --check web/app.js
